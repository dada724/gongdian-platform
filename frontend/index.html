<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工电中心一体化平台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0e1a;--card-bg:rgba(20,28,50,0.65);--border:rgba(100,140,255,0.2);
  --accent:#4facfe;--accent2:#00f2fe;--green:#00e676;--orange:#ff9100;
  --text:#e0e6f0;--text2:#8892a8;--danger:#ff5252;
}
body{
  font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;overflow-x:hidden;
  background-image:
    radial-gradient(ellipse at 10% 20%,rgba(79,172,254,0.08) 0%,transparent 60%),
    radial-gradient(ellipse at 90% 80%,rgba(0,242,254,0.06) 0%,transparent 60%);
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(79,172,254,0.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(79,172,254,0.03) 1px,transparent 1px);
  background-size:60px 60px;
}

/* 登录页 */
.login-page{
  position:fixed;inset:0;z-index:9999;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg);
  background-image:radial-gradient(ellipse at 50% 30%,rgba(79,172,254,0.12) 0%,transparent 60%);
}
.login-card{
  background:var(--card-bg);border:1px solid var(--border);
  border-radius:20px;padding:48px 40px;width:400px;max-width:92vw;
  backdrop-filter:blur(24px);text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);animation:fadeUp .4s ease;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.login-logo{
  width:56px;height:56px;border-radius:14px;margin:0 auto 20px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;
  font-size:26px;font-weight:700;color:#fff;
  box-shadow:0 0 24px rgba(79,172,254,0.35);
}
.login-card h2{
  font-size:22px;margin-bottom:6px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.login-card .subtitle{font-size:13px;color:var(--text2);margin-bottom:28px}
.login-card .form-group{text-align:left;margin-bottom:16px}
.login-card label{display:block;font-size:12px;color:var(--text2);margin-bottom:5px;font-weight:500}
.login-card input{
  width:100%;padding:11px 14px;border-radius:10px;
  border:1px solid var(--border);background:rgba(10,14,26,0.8);
  color:var(--text);font-size:14px;outline:none;transition:border-color .2s;
}
.login-card input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,172,254,0.1)}
.login-btn{
  width:100%;padding:12px;border:none;border-radius:10px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;font-size:15px;font-weight:600;cursor:pointer;
  margin-top:8px;transition:box-shadow .2s;
}
.login-btn:hover{box-shadow:0 0 24px rgba(79,172,254,0.4)}
.switch-link{font-size:12px;color:var(--accent);cursor:pointer;margin-top:14px;display:inline-block}
.switch-link:hover{text-decoration:underline}
.login-err{color:var(--danger);font-size:12px;margin-top:10px;min-height:18px}

/* 主页面 */
.main-page{display:none;position:relative;z-index:1}
body.logged-in .main-page{display:block}
body.logged-in .login-page{display:none}

/* 顶部栏 */
.header{
  position:sticky;top:0;z-index:100;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  background:rgba(10,14,26,0.8);
  border-bottom:1px solid var(--border);
  padding:12px 28px;display:flex;align-items:center;justify-content:space-between;
}
.header-left{display:flex;align-items:center;gap:14px}
.logo-sm{
  width:36px;height:36px;border-radius:10px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:700;color:#fff;
}
.header h1{font-size:17px;font-weight:600;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.header-right{display:flex;align-items:center;gap:10px}
.user-badge{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:6px}
.role-tag{padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600}
.role-dev{background:rgba(79,172,254,0.15);color:var(--accent)}
.role-edit{background:rgba(0,230,118,0.15);color:var(--green)}
.role-view{background:rgba(136,146,168,0.15);color:var(--text2)}

.btn{
  padding:7px 16px;border-radius:8px;border:1px solid var(--border);
  background:var(--card-bg);color:var(--text);cursor:pointer;
  font-size:12px;transition:all .2s;display:inline-flex;align-items:center;gap:5px;
  backdrop-filter:blur(10px);
}
.btn:hover{border-color:var(--accent)}
.btn-primary{
  background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;
  box-shadow:0 0 16px rgba(79,172,254,0.25);
}
.btn-primary:hover{box-shadow:0 0 28px rgba(79,172,254,0.45)}
.btn-danger{border-color:rgba(255,82,82,0.3);color:var(--danger)}
.btn-danger:hover{border-color:var(--danger);background:rgba(255,82,82,0.1)}
.btn-sm{padding:4px 10px;font-size:11px}

.main{padding:28px 32px;max-width:1400px;margin:0 auto}

/* 模块卡片 */
.module-card{
  background:var(--card-bg);border:1px solid var(--border);
  border-radius:16px;margin-bottom:18px;
  backdrop-filter:blur(20px);transition:all .3s;position:relative;overflow:hidden;
}
.module-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--accent),var(--accent2),transparent);
  opacity:0;transition:opacity .3s;
}
.module-card:hover::before{opacity:1}
.module-card:hover{border-color:rgba(79,172,254,0.3);box-shadow:0 8px 40px rgba(79,172,254,0.1)}
.drag-handle{
  position:absolute;left:8px;top:50%;transform:translateY(-50%);
  cursor:grab;color:var(--text2);font-size:17px;padding:8px;transition:color .2s;
}
.drag-handle:hover{color:var(--accent)}
.card-header{
  display:flex;align-items:center;padding:16px 24px 16px 40px;
  border-bottom:1px solid var(--border);
}
.card-title{font-size:15px;font-weight:600;flex:1;display:flex;align-items:center;gap:9px}
.card-title .icon-box{
  width:30px;height:30px;border-radius:8px;background:rgba(79,172,254,0.1);
  display:flex;align-items:center;justify-content:center;font-size:15px;
}
.card-actions{display:flex;gap:6px}
.card-body{padding:18px 24px 22px 40px}

/* 子模块网格 */
.sub-grid{display:flex;flex-wrap:wrap;gap:13px}
.sub-card{
  background:rgba(10,14,26,0.6);border:1px solid var(--border);
  border-radius:14px;padding:0 0 9px 0;cursor:pointer;
  transition:all .25s;position:relative;overflow:hidden;
  width:108px;flex:0 0 auto;
  display:flex;flex-direction:column;align-items:center;text-align:center;
}
.sub-card:hover{border-color:rgba(79,172,254,0.4);transform:translateY(-2px);box-shadow:0 4px 20px rgba(79,172,254,0.1)}
.sub-icon{
  width:108px;height:86px;border-radius:14px 14px 0 0;
  display:flex;align-items:center;justify-content:center;
  font-size:36px;flex-shrink:0;margin-bottom:5px;
}
.sub-icon img{width:46px;height:46px;border-radius:10px;object-fit:contain}
.sub-icon .letter-icon{font-size:26px;font-weight:800}
.sub-icon.icon-web{background:rgba(79,172,254,0.13)}
.sub-icon.icon-link{background:rgba(0,230,118,0.13)}
.sub-icon.icon-file{background:rgba(255,145,0,0.13)}
.sub-icon.icon-text{background:rgba(156,39,176,0.13)}
.sub-text-area{width:100%;padding:0 6px}
.sub-card .sub-title{font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.sub-card .sub-desc{font-size:10px;color:var(--text2);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.sub-card .sub-actions{position:absolute;top:8px;right:8px;display:flex;gap:3px;opacity:0;transition:opacity .2s}
.sub-card:hover .sub-actions{opacity:1}
.sub-actions .btn-sm{padding:2px 7px;font-size:10px;background:rgba(10,14,26,0.9)}

.embed-frame{width:100%;height:400px;border:1px solid var(--border);border-radius:10px;margin-top:10px;background:#fff}
.empty-state{text-align:center;padding:60px 20px;color:var(--text2)}
.empty-state .icon-big{font-size:48px;margin-bottom:16px;opacity:0.5}

/* 弹窗 */
.modal-overlay{
  position:fixed;inset:0;z-index:1000;
  background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;
}
.modal-overlay.active{display:flex}
.modal{
  background:rgba(20,28,50,0.95);border:1px solid var(--border);
  border-radius:20px;padding:30px;width:540px;max-width:92vw;
  max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.5);
  animation:modalIn .25s ease;
}
@keyframes modalIn{from{opacity:0;transform:translateY(20px) scale(0.96)}to{opacity:1;transform:none}}
.modal h2{font-size:17px;margin-bottom:22px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;color:var(--text2);margin-bottom:5px;font-weight:500}
.form-group input,.form-group textarea,.form-group select{
  width:100%;padding:9px 13px;border-radius:8px;
  border:1px solid var(--border);background:rgba(10,14,26,0.8);
  color:var(--text);font-size:13px;outline:none;transition:border-color .2s;
}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{
  border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,172,254,0.1);}
.form-group textarea{resize:vertical;min-height:70px;font-family:inherit}
.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:7px}
.type-option{padding:14px;border:2px solid var(--border);border-radius:12px;cursor:pointer;transition:all .2s;text-align:center}
.type-option:hover{border-color:rgba(79,172,254,0.4)}
.type-option.selected{border-color:var(--accent);background:rgba(79,172,254,0.08)}
.type-option .type-icon{font-size:26px;margin-bottom:7px}
.type-option .type-name{font-size:13px;font-weight:600}
.type-option .type-desc{font-size:10.5px;color:var(--text2);margin-top:3px}
.icon-choose-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:7px}
.icon-option{
  padding:11px 7px;border:2px solid var(--border);border-radius:12px;
  cursor:pointer;transition:all .2s;text-align:center;
}
.icon-option:hover{border-color:rgba(79,172,254,0.4)}
.icon-option.selected{border-color:var(--accent);background:rgba(79,172,254,0.08)}
.icon-opt-preview{width:34px;height:34px;border-radius:50%;margin:0 auto 5px;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;background:rgba(79,172,254,0.1);color:var(--accent);}
.icon-opt-preview.auto{font-weight:700;font-size:13px}
.icon-opt-name{font-size:11px;color:var(--text2)}

/* 用户管理 */
.user-table{width:100%;border-collapse:collapse;margin-top:10px}
.user-table th{font-size:12px;color:var(--text2);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}
.user-table td{font-size:13px;padding:8px 10px;border-bottom:1px solid rgba(100,140,255,0.08)}
.user-table tr:hover td{background:rgba(79,172,254,0.04)}
.user-table select{
  padding:4px 6px;border-radius:6px;border:1px solid var(--border);
  background:rgba(10,14,26,0.8);color:var(--text);font-size:12px;
}
.perm-tag{
  display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;
  background:rgba(79,172,254,0.1);color:var(--accent);margin:1px;
}

::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(79,172,254,0.3);border-radius:3px}
@media(max-width:768px){.main{padding:14px}.header{padding:10px 14px}.sub-grid{flex-direction:column}}
</style>
</head>
<body>

<!-- 登录页 -->
<div class="login-page" id="loginPage">
  <div class="login-card">
    <div class="login-logo">工</div>
    <h2 id="loginTitle">登录</h2>
    <p class="subtitle" id="loginSub">登录工电中心一体化平台</p>
    <div class="form-group">
      <label>用户名</label>
      <input type="text" id="loginUser" placeholder="请输入用户名">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="loginPwd" placeholder="请输入密码" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="login-btn" onclick="doLogin()">登 录</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- 主页面 -->
<div class="main-page" id="mainPage">
  <div class="header">
    <div class="header-left">
      <div class="logo-sm">工</div>
      <h1>工电中心一体化平台</h1>
    </div>
    <div class="header-right">
      <span class="user-badge">
        <span id="headerUser"></span>
        <span class="role-tag" id="headerRole"></span>
      </span>
      <button class="btn" id="btnUserMgr" onclick="showUserMgr()" style="display:none">用户管理</button>
      <button class="btn btn-sm" onclick="doLogout()">退出</button>
    </div>
  </div>

  <div class="main">
    <div style="display:flex;gap:10px;margin-bottom:20px">
      <button class="btn btn-primary" id="btnAddModule" onclick="openAddModuleModal()">＋ 新增模块</button>
    </div>

    <div class="empty-state" id="emptyState">
      <div class="icon-big">📋</div>
      <p>暂无模块，点击「新增模块」开始构建平台</p>
    </div>
    <div id="modulesContainer"></div>
  </div>
</div>

<!-- 模块弹窗 -->
<div class="modal-overlay" id="moduleModal">
  <div class="modal">
    <h2 id="moduleModalTitle">新增模块</h2>
    <div class="form-group">
      <label>模块名称</label>
      <input type="text" id="moduleName" placeholder="例如：供电监控系统">
    </div>
    <div class="form-group">
      <label>模块图标</label>
      <input type="text" id="moduleIcon" placeholder="输入 emoji，如 📊">
    </div>
    <div class="form-actions">
      <button class="btn" onclick="closeModuleModal()">取消</button>
      <button class="btn btn-primary" onclick="saveModule()">保存</button>
    </div>
  </div>
</div>

<!-- 子模块弹窗 -->
<div class="modal-overlay" id="subModal">
  <div class="modal">
    <h2>新增子模块</h2>
    <div class="form-group">
      <label>子模块名称</label>
      <input type="text" id="subName" placeholder="例如：实时监控大屏">
    </div>
    <div class="form-group">
      <label>类型</label>
      <div class="type-grid">
        <div class="type-option" onclick="selectType('web')" id="type-web">
          <div class="type-icon">🌐</div>
          <div class="type-name">嵌入网页</div>
          <div class="type-desc">内嵌网页/监控大屏</div>
        </div>
        <div class="type-option" onclick="selectType('link')" id="type-link">
          <div class="type-icon">🔗</div>
          <div class="type-name">外部链接</div>
          <div class="type-desc">跳转任意网址</div>
        </div>
        <div class="type-option" onclick="selectType('file')" id="type-file">
          <div class="type-icon">📁</div>
          <div class="type-name">文件上传</div>
          <div class="type-desc">记录文件信息</div>
        </div>
        <div class="type-option" onclick="selectType('text')" id="type-text">
          <div class="type-icon">📝</div>
          <div class="type-name">文本备注</div>
          <div class="type-desc">说明/文档/备注</div>
        </div>
      </div>
    </div>
    <div class="form-group">
      <label>图标样式</label>
      <div class="icon-choose-grid">
        <div class="icon-option" onclick="selectSubIcon('auto')" id="icon-opt-auto">
          <div class="icon-opt-preview auto">首</div>
          <div class="icon-opt-name">首字母</div>
        </div>
        <div class="icon-option" onclick="selectSubIcon('emoji')" id="icon-opt-emoji">
          <div class="icon-opt-preview">🎨</div>
          <div class="icon-opt-name">Emoji</div>
        </div>
        <div class="icon-option" onclick="selectSubIcon('image')" id="icon-opt-image">
          <div class="icon-opt-preview">🖼</div>
          <div class="icon-opt-name">图片</div>
        </div>
        <div class="icon-option" onclick="selectSubIcon('favicon')" id="icon-opt-favicon">
          <div class="icon-opt-preview">🌐</div>
          <div class="icon-opt-name">网站图标</div>
        </div>
      </div>
    </div>
    <div id="subIconField"></div>
    <div id="subFields"></div>
    <div class="form-actions">
      <button class="btn" onclick="closeSubModal()">取消</button>
      <button class="btn btn-primary" onclick="saveSubModule()">保存</button>
    </div>
  </div>
</div>

<!-- 文本查看弹窗 -->
<div class="modal-overlay" id="textViewModal">
  <div class="modal">
    <h2 id="textViewTitle">文本备注</h2>
    <div id="textViewContent" style="line-height:1.8;font-size:14px;white-space:pre-wrap;max-height:50vh;overflow-y:auto;padding:16px;background:rgba(10,14,26,0.6);border-radius:10px"></div>
    <div class="form-actions">
      <button class="btn" onclick="closeTextView()">关闭</button>
    </div>
  </div>
</div>

<!-- 用户管理弹窗 -->
<div class="modal-overlay" id="userMgrModal">
  <div class="modal" style="width:720px">
    <h2>用户管理
      <button class="btn btn-sm" onclick="showAddUserForm()" style="float:right;font-size:12px">＋ 新增用户</button>
    </h2>
    <div id="addUserForm" style="display:none;margin-bottom:16px;padding:12px;background:rgba(10,14,26,0.6);border-radius:10px">
      <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap">
        <div class="form-group" style="margin:0;flex:1;min-width:100px">
          <label>账号</label>
          <input type="text" id="newUserName" placeholder="登录账号" style="padding:7px 10px;font-size:13px">
        </div>
        <div class="form-group" style="margin:0;flex:1;min-width:100px">
          <label>姓名</label>
          <input type="text" id="newUserNameReal" placeholder="姓名" style="padding:7px 10px;font-size:13px">
        </div>
        <div class="form-group" style="margin:0;flex:1;min-width:100px">
          <label>密码</label>
          <input type="password" id="newUserPwd" placeholder="密码" style="padding:7px 10px;font-size:13px">
        </div>
        <div class="form-group" style="margin:0;flex:1;min-width:100px">
          <label>部门</label>
          <input type="text" id="newUserDept" placeholder="部门" style="padding:7px 10px;font-size:13px">
        </div>
        <div class="form-group" style="margin:0;flex:1;min-width:100px">
          <label>岗位</label>
          <input type="text" id="newUserPos" placeholder="岗位" style="padding:7px 10px;font-size:13px">
        </div>
        <div class="form-group" style="margin:0">
          <label>角色</label>
          <select id="newUserRole" style="padding:7px 10px;font-size:13px;border-radius:8px;border:1px solid var(--border);background:rgba(10,14,26,0.8);color:var(--text)">
            <option value="viewer">可查看</option>
            <option value="editor">可编辑</option>
            <option value="developer">开发者</option>
          </select>
        </div>
        <div style="display:flex;gap:6px;align-items:flex-end">
          <button class="btn btn-sm" onclick="createUser()">确认</button>
          <button class="btn btn-sm" onclick="cancelAddUser()">取消</button>
        </div>
      </div>
      <div id="addUserErr" style="color:var(--danger);font-size:12px;margin-top:6px"></div>
    </div>
    <div id="userMgrContent"></div>
    <div class="form-actions">
      <button class="btn" onclick="closeUserMgr()">关闭</button>
    </div>
  </div>
</div>

<script>
// ─── 全局状态 ───────────────────────────────────────────────────────
let API_BASE = '';   // 后端地址，空 = 同域
let TOKEN = localStorage.getItem('gd_token') || '';
let CURRENT_USER = null;
let MODULES_DATA = [];

// ─── 工具 ───────────────────────────────────────────────────────────
function authHeaders(){ return {'Authorization':'Bearer '+TOKEN,'Content-Type':'application/json'} }
function escHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function getFaviconUrl(url){
  if(!url) return '';
  try{ const u=new URL(url.startsWith('http')?url:'https://'+url); return 'https://www.google.com/s2/favicons?domain='+u.hostname+'&sz=64'; }
  catch(e){ return ''; }
}

// ─── 登录 / 注册 ───────────────────────────────────────────────────
function switchMode(){
  IS_REGISTER = !IS_REGISTER;
  document.getElementById('loginTitle').textContent = IS_REGISTER ? '注册' : '登录';
  document.getElementById('loginSub').textContent = IS_REGISTER ? '注册新账号（第一个账号自动为管理员）' : '登录工电中心一体化平台';
  document.querySelector('.login-btn').textContent = IS_REGISTER ? '注 册' : '登 录';
  document.getElementById('switchLink').textContent = IS_REGISTER ? '已有账号？点击登录' : '没有账号？点击注册';
  document.getElementById('loginErr').textContent = '';
}

async function doLogin(){
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPwd').value;
  if(!u||!p){ setErr('请填写用户名和密码'); return; }
  const url = '/api/login';
  const resp = await fetch(url, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({username:u, password:p})
  });
  const data = await resp.json();
  if(!resp.ok){ setErr(data.detail||'操作失败'); return; }
  TOKEN = data.access_token;
  localStorage.setItem('gd_token', TOKEN);
  CURRENT_USER = {username:data.username, role:data.role};
  enterApp();
}

function setErr(msg){ document.getElementById('loginErr').textContent = msg; }

function doLogout(){
  TOKEN = ''; CURRENT_USER = null;
  localStorage.removeItem('gd_token');
  document.body.classList.remove('logged-in');
  document.getElementById('loginPage').style.display = 'flex';
  document.getElementById('loginUser').value = '';
  document.getElementById('loginPwd').value = '';
}

// ─── 进入应用 ─────────────────────────────────────────────────────
async function enterApp(){
  // 获取当前用户信息
  const resp = await fetch('/api/me', {headers:authHeaders()});
  if(!resp.ok){ doLogout(); return; }
  CURRENT_USER = await resp.json();
  localStorage.setItem('gd_token', TOKEN);
  document.body.classList.add('logged-in');
  applyPermissions();
  loadModules();
}

function applyPermissions(){
  const r = CURRENT_USER.role;
  const isEditor = (r==='developer' || r==='editor');
  document.getElementById('btnAddModule').style.display = isEditor ? '' : 'none';
  document.getElementById('btnUserMgr').style.display = r==='developer' ? '' : 'none';
  document.getElementById('btnFaultMgr').style.display = isEditor ? '' : 'none';
  const roleTag = document.getElementById('headerRole');
  roleTag.textContent = {developer:'开发者',editor:'可编辑',viewer:'可查看'}[r]||r;
  roleTag.className = 'role-tag role-'+r.slice(0,4);
  document.getElementById('headerUser').textContent = CURRENT_USER.username;
}

// ─── 加载模块 ─────────────────────────────────────────────────────
async function loadModules(){
  const resp = await fetch('/api/modules', {headers:authHeaders()});
  if(!resp.ok){ console.error(await resp.text()); return; }
  MODULES_DATA = await resp.json();
  render();
}

// ─── 渲染 ─────────────────────────────────────────────────────────
function render(){
  const container = document.getElementById('modulesContainer');
  const empty = document.getElementById('emptyState');
  if(MODULES_DATA.length===0){ empty.style.display='block'; container.innerHTML=''; return; }
  empty.style.display='none';
  const isEditor = (CURRENT_USER.role==='developer'||CURRENT_USER.role==='editor');
  container.innerHTML = MODULES_DATA.map(mod=>{
    const canEditThis = canEditModule(mod.id);
    const showActions = isEditor || canEditThis;
    return `
    <div class="module-card" ${isEditor?`draggable="true" ondragstart="onModuleDragStart(event,'${mod.id}')" ondragover="onModuleDragOver(event)" ondrop="onModuleDrop(event,'${mod.id}')"`:''}>
      ${isEditor?'<div class="drag-handle" title="拖拽排序">⠿</div>':''}
      <div class="card-header">
        <div class="card-title">
          <div class="icon-box">${escHtml(mod.icon||'📦')}</div>
          <span>${escHtml(mod.name)}</span>
          <span style="font-size:12px;color:var(--text2);font-weight:400">（${mod.subs?mod.subs.length:0} 个子项）</span>
        </div>
        <div class="card-actions">
          ${showActions?`<button class="btn btn-sm" onclick="openAddSubModal('${mod.id}')">＋ 子模块</button>`:''}
          ${showActions?`<button class="btn btn-sm" onclick="editModule('${mod.id}')">✏ 编辑</button>`:''}
          ${showActions?`<button class="btn btn-sm btn-danger" onclick="deleteModule('${mod.id}')">🗑 删除</button>`:''}
        </div>
      </div>
      <div class="card-body">
        ${mod.subs&&mod.subs.length?`<div class="sub-grid">${mod.subs.map(sub=>renderSub(mod.id,sub)).join('')}</div>`:`<div style="color:var(--text2);font-size:13px;padding:10px 0">暂无子模块</div>`}
      </div>
    </div>`;
  }).join('');
}

function canEditModule(moduleId){
  if(CURRENT_USER.role==='developer'||CURRENT_USER.role==='editor') return true;
  // viewer 需要检查 module_permissions（前端做 UI 控制，后端还会二次校验）
  return false; // 前端保守处理，具体由后端控制
}

function getSubIconHtml(sub){
  const cls = 'icon-'+(sub.type||'web');
  if(sub.icon_type==='image'&&sub.icon){
    return {html:'<img src="'+escHtml(sub.icon)+'" alt="">', cls};
  }
  if(sub.icon_type==='emoji'&&sub.icon){
    return {html:'<span>'+sub.icon+'</span>', cls};
  }
  if(sub.icon_type==='auto'||!sub.icon_type){
    const ch = (sub.name||'').charAt(0);
    return {html:'<span class="letter-icon">'+escHtml(ch||'?')+'</span>', cls};
  }
  if(sub.icon_type==='favicon'&&(sub.url||sub.linkUrl)){
    const fav = getFaviconUrl(sub.url||sub.linkUrl);
    if(fav) return {html:'<img src="'+fav+'" alt="" onerror="this.style.display=\'none\'">', cls};
  }
  const icons = {web:'🌐',link:'🔗',file:'📁',text:'📝'};
  return {html:'<span>'+(icons[sub.type]||'📦')+'</span>', cls};
}

function renderSub(modId, sub){
  const {html, cls} = getSubIconHtml(sub);
  const canEdit = (CURRENT_USER.role==='developer'||CURRENT_USER.role==='editor');
  return `
    <div class="sub-card" onclick="onSubClick('${modId}','${sub.id}')">
      ${canEdit?`<div class="sub-actions"><button class="btn btn-sm" onclick="event.stopPropagation();editSub('${modId}','${sub.id}')">✏</button><button class="btn btn-sm btn-danger" onclick="event.stopPropagation();deleteSub('${modId}','${sub.id}')">🗑</button></div>`:''}
      <div class="sub-icon ${cls}">${html}</div>
      <div class="sub-text-area">
        <div class="sub-title">${escHtml(sub.name)}</div>
        <div class="sub-desc">${escHtml(sub.desc||sub.file_name||(sub.content||'').slice(0,30)||'')}</div>
      </div>
    </div>`;
}

// ─── 子模块点击 ───────────────────────────────────────────────────
function onSubClick(modId, subId){
  const mod = MODULES_DATA.find(m=>m.id===modId);
  const sub = mod&&mod.subs?mod.subs.find(s=>s.id===subId):null;
  if(!sub) return;
  if(sub.type==='link'&&sub.url) window.open(sub.url,'_blank');
  else if(sub.type==='web'&&sub.url) window.open(sub.url,'_blank');
  else if(sub.type==='text'){ document.getElementById('textViewTitle').textContent=sub.name; document.getElementById('textViewContent').textContent=sub.content||''; document.getElementById('textViewModal').classList.add('active'); }
  else if(sub.type==='file'){ alert('文件名：'+(sub.file_name||'未命名')); }
}
function closeTextView(){ document.getElementById('textViewModal').classList.remove('active'); }

// ─── 模块 CRUD ────────────────────────────────────────────────────
let editingModuleId = null;

function openAddModuleModal(){
  editingModuleId = null;
  document.getElementById('moduleModalTitle').textContent = '新增模块';
  document.getElementById('moduleName').value = '';
  document.getElementById('moduleIcon').value = '';
  document.getElementById('moduleModal').classList.add('active');
}
function editModule(id){
  const mod = MODULES_DATA.find(m=>m.id===id);
  if(!mod) return;
  editingModuleId = id;
  document.getElementById('moduleModalTitle').textContent = '编辑模块';
  document.getElementById('moduleName').value = mod.name;
  document.getElementById('moduleIcon').value = mod.icon||'';
  document.getElementById('moduleModal').classList.add('active');
}
function closeModuleModal(){ document.getElementById('moduleModal').classList.remove('active'); }

async function saveModule(){
  const name = document.getElementById('moduleName').value.trim();
  const icon = document.getElementById('moduleIcon').value.trim();
  if(!name){ alert('请输入模块名称'); return; }
  let resp;
  if(editingModuleId){
    resp = await fetch('/api/modules/'+editingModuleId, {
      method:'PUT', headers:authHeaders(),
      body: JSON.stringify({name, icon})
    });
  } else {
    resp = await fetch('/api/modules', {
      method:'POST', headers:authHeaders(),
      body: JSON.stringify({name, icon})
    });
  }
  if(!resp.ok){ alert((await resp.json()).detail||'操作失败'); return; }
  closeModuleModal();
  loadModules();
}

async function deleteModule(id){
  if(!confirm('确认删除该模块及其所有子模块？')) return;
  const resp = await fetch('/api/modules/'+id, {method:'DELETE', headers:authHeaders()});
  if(!resp.ok){ alert((await resp.json()).detail||'删除失败'); return; }
  loadModules();
}

// ─── 模块拖拽排序 ─────────────────────────────────────────────────
let dragModuleId = null;
function onModuleDragStart(e, id){ dragModuleId = id; e.dataTransfer.effectAllowed='move'; }
function onModuleDragOver(e){ e.preventDefault(); e.dataTransfer.dropEffect='move'; }
function onModuleDrop(e, targetId){
  e.preventDefault();
  if(!dragModuleId||dragModuleId===targetId) return;
  const ids = MODULES_DATA.map(m=>m.id);
  const fromIdx = ids.indexOf(dragModuleId);
  const toIdx = ids.indexOf(targetId);
  ids.splice(fromIdx,1);
  ids.splice(toIdx,0,dragModuleId);
  // 调用后端排序
  fetch('/api/modules/reorder', {
    method:'POST', headers:authHeaders(),
    body: JSON.stringify({ids})
  }).then(()=>loadModules());
  dragModuleId = null;
}

// ─── 子模块 CRUD ──────────────────────────────────────────────────
let editingSubId = null;
let editingSubModId = null;
let selectedType = null;
let selectedSubIconType = 'auto';

function openAddSubModal(modId){
  editingSubModId = modId; editingSubId = null; selectedType = null; selectedSubIconType = 'auto';
  document.getElementById('subName').value = '';
  document.getElementById('subFields').innerHTML = '';
  document.getElementById('subIconField').innerHTML = '';
  document.querySelectorAll('.type-option').forEach(el=>el.classList.remove('selected'));
  document.querySelectorAll('.icon-option').forEach(el=>el.classList.remove('selected'));
  document.getElementById('icon-opt-auto').classList.add('selected');
  document.getElementById('subModal').classList.add('active');
}

async function editSub(modId, subId){
  editingSubModId = modId; editingSubId = subId;
  const mod = MODULES_DATA.find(m=>m.id===modId);
  const sub = mod&&mod.subs?mod.subs.find(s=>s.id===subId):null;
  if(!sub) return;
  selectedType = sub.type;
  selectedSubIconType = sub.icon_type||'auto';
  document.getElementById('subName').value = sub.name;
  document.querySelectorAll('.type-option').forEach(el=>el.classList.remove('selected'));
  const te = document.getElementById('type-'+sub.type); if(te) te.classList.add('selected');
  document.querySelectorAll('.icon-option').forEach(el=>el.classList.remove('selected'));
  const ie = document.getElementById('icon-opt-'+selectedSubIconType); if(ie) ie.classList.add('selected');
  buildSubFields(sub);
  buildSubIconField(sub);
  document.getElementById('subModal').classList.add('active');
}

function closeSubModal(){ document.getElementById('subModal').classList.remove('active'); }

function selectType(type){ selectedType=type; document.querySelectorAll('.type-option').forEach(el=>el.classList.remove('selected')); const el=document.getElementById('type-'+type); if(el)el.classList.add('selected'); buildSubFields(); }
function selectSubIcon(iconType){ selectedSubIconType=iconType; document.querySelectorAll('.icon-option').forEach(el=>el.classList.remove('selected')); const el=document.getElementById('icon-opt-'+iconType); if(el)el.classList.add('selected'); buildSubIconField(); }

function buildSubIconField(vals={}){
  let html='';
  if(selectedSubIconType==='emoji') html='<div class="form-group"><label>Emoji 图标</label><input type="text" id="subIconEmoji" value="'+(vals.icon||'')+'" placeholder="输入 emoji，如 📊"></div>';
  else if(selectedSubIconType==='image') html='<div class="form-group"><label>图片 URL</label><input type="text" id="subIconImage" value="'+(vals.icon||'')+'" placeholder="https://example.com/logo.png"></div>';
  document.getElementById('subIconField').innerHTML = html;
}

function buildSubFields(vals={}){
  const map = {
    web:'<div class="form-group"><label>网页 URL</label><input type="text" id="subUrl" value="'+(vals.url||'')+'" placeholder="https://example.com"></div>',
    link:'<div class="form-group"><label>链接地址</label><input type="text" id="subUrl" value="'+(vals.url||'')+'" placeholder="https://example.com"></div>',
    file:'<div class="form-group"><label>文件名称</label><input type="text" id="subFileName" value="'+(vals.file_name||'')+'" placeholder="文件名"><textarea id="subDesc" placeholder="可选备注">'+(vals.desc||'')+'</textarea></div>',
    text:'<div class="form-group"><label>备注内容</label><textarea id="subContent" style="min-height:120px" placeholder="输入文本内容">'+(vals.content||'')+'</textarea></div>'
  };
  document.getElementById('subFields').innerHTML = map[selectedType]||'';
}

async function saveSubModule(){
  const name = document.getElementById('subName').value.trim();
  if(!name){ alert('请输入子模块名称'); return; }
  if(!selectedType&&!editingSubId){ alert('请选择类型'); return; }
  const body = {name, type:selectedType, icon_type:selectedSubIconType};
  if(selectedSubIconType==='emoji') body.icon = (document.getElementById('subIconEmoji')||{}).value||'';
  else if(selectedSubIconType==='image') body.icon = (document.getElementById('subIconImage')||{}).value||'';
  if(selectedType==='web'||selectedType==='link') body.url = (document.getElementById('subUrl')||{}).value||'';
  if(selectedType==='file'){ body.file_name=(document.getElementById('subFileName')||{}).value||''; body.desc=(document.getElementById('subDesc')||{}).value||''; }
  if(selectedType==='text') body.content = (document.getElementById('subContent')||{}).value||'';
  let resp;
  if(editingSubId){
    resp = await fetch('/api/subs/'+editingSubId, {method:'PUT',headers:authHeaders(),body:JSON.stringify(body)});
  } else {
    resp = await fetch('/api/modules/'+editingSubModId+'/subs', {method:'POST',headers:authHeaders(),body:JSON.stringify(body)});
  }
  if(!resp.ok){ alert((await resp.json()).detail||'操作失败'); return; }
  closeSubModal();
  loadModules();
}

async function deleteSub(modId, subId){
  if(!confirm('确认删除该子模块？')) return;
  const resp = await fetch('/api/subs/'+subId, {method:'DELETE',headers:authHeaders()});
  if(!resp.ok){ alert((await resp.json()).detail||'删除失败'); return; }
  loadModules();
}

// ── 新增用户相关 ─────────────────────────────────────────────
function showAddUserForm(){
  document.getElementById('addUserForm').style.display = 'block';
  document.getElementById('addUserErr').textContent = '';
  document.getElementById('newUserName').value = '';
  document.getElementById('newUserPwd').value = '';

function cancelAddUser(){

async function createUser(){
  const u = document.getElementById('newUserName').value.trim();
  const n = document.getElementById('newUserNameReal').value.trim();
  const p = document.getElementById('newUserPwd').value;
  const d = document.getElementById('newUserDept').value.trim();
  const pos = document.getElementById('newUserPos').value.trim();
  const r = document.getElementById('newUserRole').value;
  if(!u||!p){ document.getElementById('addUserErr').textContent = '请填写账号和密码'; return; }
  const resp = await fetch('/api/users', {
    method:'POST', headers:authHeaders(),
    body: JSON.stringify({username:u, name:n, password:p, role:r, department:d, position:pos})
  });
  const data = await resp.json();
  if(!resp.ok){ document.getElementById('addUserErr').textContent = data.detail||'创建失败'; return; }
  document.getElementById('addUserForm').style.display = 'none';
  showUserMgr();
}

async function showUserMgr(){
  const resp = await fetch('/api/users', {headers:authHeaders()});
  if(!resp.ok){ alert('无权限'); return; }
  const users = await resp.json();
  // 获取所有模块供权限分配
  const modResp = await fetch('/api/modules', {headers:authHeaders()});
  const modules = modResp.ok ? await modResp.json() : [];
  let html = '<div style="margin-bottom:10px">';
  html += '<button class="btn btn-sm" onclick="exportUsers()" style="margin-right:6px">📤 导出CSV</button>';
  html += '<button class="btn btn-sm" onclick="document.getElementById(\'importFileInput\').click()">📥 导入CSV</button>';
  html += '<input type="file" id="importFileInput" accept=".csv" style="display:none" onchange="importUsers(this)">';
  html += '</div>';
  html += '<table class="user-table"><tr><th>账号</th><th>姓名</th><th>部门</th><th>岗位</th><th>角色</th><th>模块权限</th><th>操作</th></tr>';
  users.forEach(u=>{
    html += '<tr><td>'+escHtml(u.username)+'</td>';
    html += '<td>'+(u.name?escHtml(u.name):'—')+'</td>';
    html += '<td>'+(u.department?escHtml(u.department):'—')+'</td>';
    html += '<td>'+(u.position?escHtml(u.position):'—')+'</td>';
    html += '<td>';
    html += '<select onchange="changeRole('+u.id+',this.value)">';
    ['developer','editor','viewer'].forEach(r=>{ html+='<option value="'+r+'"'+(u.role===r?' selected':'')+'>'+( {developer:'开发者',editor:'可编辑',viewer:'可查看'}[r] )+'</option>'; });
    html += '</select></td><td>';
    // 所有角色均可分配模块权限
    html += '<div style="max-height:80px;overflow-y:auto">';
    modules.forEach(m=>{
      const checked = (u.module_permissions||[]).includes(m.id) ? 'checked' : '';
      html += `<label style="font-size:11px;display:block"><input type="checkbox" onchange="togglePerm(${u.id},'${m.id}',this.checked)" ${checked}> ${escHtml(m.name)}</label>`;
    });
    html += '</div>';
    html += '</td><td><span style="font-size:12px;color:var(--text2)">ID:'+u.id+'</span></td></tr>';
  });
  html += '</table>';
  document.getElementById('userMgrContent').innerHTML = html;
  document.getElementById('userMgrModal').classList.add('active');
}
function closeUserMgr(){ document.getElementById('userMgrModal').classList.remove('active'); }

async function changeRole(uid, newRole){
  await fetch('/api/users/'+uid+'/role', {
    method:'PUT', headers:authHeaders(),
    body: JSON.stringify({role:newRole})
  });
  showUserMgr(); // 刷新
}

async function togglePerm(uid, modId, checked){
  // 获取当前权限，然后更新
  const resp = await fetch('/api/users', {headers:authHeaders()});
  const users = await resp.json();
  const user = users.find(u=>u.id===uid);
  let perms = user.module_permissions||[];
  if(checked){ if(!perms.includes(modId)) perms.push(modId); }
  else { perms = perms.filter(id=>id!=modId); }
  await fetch('/api/users/'+uid+'/permissions', {
    method:'PUT', headers:authHeaders(),
    body: JSON.stringify({module_ids:perms})
  });
}

if(TOKEN){ enterApp(); }


// ── 导出用户 CSV ─────────────────────────────
async function exportUsers(){
  const resp = await fetch('/api/users/export?' + Date.now(), { headers: authHeaders() });
  if(!resp.ok){ alert('导出失败：' + resp.status); return; }
  const blob = await resp.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'users_export.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ── 导入用户 CSV ─────────────────────────────
async function importUsers(input){
  const file = input.files[0];
  if(!file){ alert('请选择 CSV 文件'); return; }
  const text = await file.text();
  const lines = text.split('\n').filter(l=>l.trim());
  if(lines.length < 2){ alert('CSV 文件至少需要表头和一行数据'); return; }
  // 解析 CSV（简单解析，支持引号）
  const users = [];
  for(let i=1; i<lines.length; i++){
    const cols = parseCSVLine(lines[i]);
    if(cols.length >= 2){
      users.push({
        username: (cols[0]||'').trim(),
        name: (cols[1]||'').trim(),
        password: (cols[2]||'').trim(),
        department: (cols[3]||'').trim(),
        position: (cols[4]||'').trim(),
        role: (cols[5]||'viewer').trim()
      });
    }
  }
  if(users.length === 0){ alert('没有可导入的用户数据'); return; }
  const resp = await fetch('/api/users/import', {
    method:'POST', headers:authHeaders(),
    body: JSON.stringify(users)
  });
  const data = await resp.json();
  alert('导入完成！新建：'+data.created+' 个，跳过（已存在）：'+data.skipped+' 个');
  showUserMgr();
}

function parseCSVLine(line){
  const result = [];
  let cur = '';
  let inQ = false;
  for(let i=0; i<line.length; i++){
    const c = line[i];
    if(inQ){
      if(c==='"' && line[i+1]==='"'){ cur+='"'; i++; }
      else if(c==='"'){ inQ = false; }
      else { cur += c; }
    } else {
      if(c==='"'){ inQ = true; }
      else if(c===','){ result.push(cur); cur=''; }
      else { cur += c; }
    }
  }
  result.push(cur);
  return result;
}
