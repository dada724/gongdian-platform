<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>故障数据表 - 工电中心</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0e1a;--card-bg:rgba(20,28,50,0.65);--border:rgba(100,140,255,0.2);
  --accent:#4facfe;--accent2:#00f2fe;--green:#00e676;--orange:#ff9100;
  --text:#e0e6f0;--text2:#8892a8;--danger:#ff5252;
}
body{
  font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;overflow-x:auto;
}
body.embedded{padding:0;margin:0}
body.embedded .header{display:none}
body.embedded .main{padding-top:10px}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(79,172,254,0.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(79,172,254,0.03) 1px,transparent 1px);
  background-size:60px 60px;
}
.header{
  position:sticky;top:0;z-index:100;
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  background:rgba(10,14,26,0.9);
  border-bottom:1px solid var(--border);
  padding:10px 20px;display:flex;align-items:center;justify-content:space-between;
}
.header h1{font-size:16px;font-weight:600;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{
  padding:6px 14px;border-radius:8px;border:1px solid var(--border);
  background:var(--card-bg);color:var(--text);cursor:pointer;
  font-size:12px;transition:all .2s;display:inline-flex;align-items:center;gap:4px;
}
.btn:hover{border-color:var(--accent)}
.btn-primary{
  background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;
  box-shadow:0 0 16px rgba(79,172,254,0.25);
}
.btn-danger{border-color:rgba(255,82,82,0.3);color:var(--danger)}
.btn-danger:hover{border-color:var(--danger);background:rgba(255,82,82,0.1)}
.btn-sm{padding:4px 10px;font-size:11px}
.main{padding:16px 20px;position:relative;z-index:1}

/* 统计卡片 */
.stats-bar{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.stat-card{
  flex:1;min-width:130px;padding:12px 14px;
  background:var(--card-bg);border:1px solid var(--border);
  border-radius:12px;
}
.stat-card .stat-label{font-size:11px;color:var(--text2)}
.stat-card .stat-value{font-size:22px;font-weight:700;margin-top:4px}
.stat-value.accent{color:var(--accent)}
.stat-value.green{color:var(--green)}
.stat-value.orange{color:var(--orange)}
.stat-value.danger{color:var(--danger)}

/* 工具栏 */
.toolbar-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}

/* 表格容器 */
.table-wrapper{
  overflow-x:auto;
  border:1px solid var(--border);border-radius:12px;
  background:var(--card-bg);backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
}

/* 数据表格 */
.data-table{width:100%;border-collapse:collapse;min-width:1800px}
.data-table thead th{
  position:sticky;top:0;z-index:10;
  background:rgba(79,172,254,0.08);
  border-right:1px solid var(--border);
  padding:8px 10px;font-size:12px;font-weight:600;
  color:var(--accent);text-align:left;white-space:nowrap;
  cursor:pointer;user-select:none;
}
.data-table th:hover{background:rgba(79,172,254,0.13)}
.data-table td{
  border-right:1px solid rgba(100,140,255,0.08);
  border-bottom:1px solid rgba(100,140,255,0.08);
  padding:6px 10px;font-size:12.5px;max-width:200px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.data-table tr:hover td{background:rgba(79,172,254,0.04)}
.data-table tr.selected td{background:rgba(79,172,254,0.1)}
.cell-checkbox{width:18px;height:18px;cursor:pointer}

/* 弹窗 */
.modal-overlay{
  position:fixed;inset:0;z-index:2000;
  background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;
}
.modal-overlay.active{display:flex}
.modal{
  background:rgba(20,28,50,0.95);border:1px solid var(--border);
  border-radius:16px;padding:24px;width:640px;max-width:92vw;
  max-height:85vh;overflow-y:auto;
}
.modal h2{font-size:16px;margin-bottom:16px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:11px;color:var(--text2);margin-bottom:4px;font-weight:500}
.form-group input,.form-group select,.form-group textarea{
  width:100%;padding:8px 10px;border-radius:8px;
  border:1px solid var(--border);background:rgba(10,14,26,0.8);
  color:var(--text);font-size:13px;outline:none;transition:border-color .2s;
}
.form-group input:focus,.form-group select:focus{border-color:var(--accent)}
.form-group textarea{resize:vertical;min-height:60px;font-family:inherit}
.form-row{display:flex;gap:10px;flex-wrap:wrap}
.form-row .form-group{flex:1;min-width:150px}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.selected-count{font-size:12px;color:var(--accent);margin-left:8px}
@media(max-width:768px){.main{padding:10px}}
</style>
</head>
<body>
<script>if(window!==window.parent)document.body.classList.add('embedded');</script>

<div class="header">
  <h1>📊 故障数据表</h1>
  <div class="toolbar">
    <button class="btn btn-primary" onclick="showAddModal()">＋ 新增故障</button>
    <button class="btn" onclick="deleteSelected()" id="btnDelete" style="display:none">🗑 删除选中</button>
    <button class="btn" onclick="exportExcel()">📤 导出Excel</button>
    <button class="btn" onclick="document.getElementById('importInput').click()">📥 导入Excel</button>
    <input type="file" id="importInput" accept=".xlsx,.xls" style="display:none" onchange="importExcel(this)">
    <span class="selected-count" id="selectedCount"></span>
  </div>
</div>

<div class="main">
  <div class="stats-bar" id="statsBar">
    <div class="stat-card"><div class="stat-label">总故障数</div><div class="stat-value accent" id="statTotal">0</div></div>
    <div class="stat-card"><div class="stat-label">本月故障</div><div class="stat-value orange" id="statMonth">0</div></div>
    <div class="stat-card"><div class="stat-label">自检</div><div class="stat-value green" id="statSelfCheck">0</div></div>
    <div class="stat-card"><div class="stat-label">非自检</div><div class="stat-value danger" id="statNotSelfCheck">0</div></div>
  </div>

  <div class="toolbar-bar">
    <input type="text" id="filterLine" placeholder="筛选线路" style="padding:5px 10px;border-radius:8px;border:1px solid var(--border);background:rgba(10,14,26,0.8);color:var(--text);font-size:12px;width:120px">
    <input type="text" id="filterDept" placeholder="筛选部门" style="padding:5px 10px;border-radius:8px;border:1px solid var(--border);background:rgba(10,14,26,0.8);color:var(--text);font-size:12px;width:120px">
    <select id="filterSelfCheck" style="padding:5px 10px;border-radius:8px;border:1px solid var(--border);background:rgba(10,14,26,0.8);color:var(--text);font-size:12px">
      <option value="">全部（自检/非自检）</option>
      <option value="自检">自检</option>
      <option value="非自检">非自检</option>
    </select>
    <input type="text" id="filterKeyword" placeholder="搜索关键词" style="padding:5px 10px;border-radius:8px;border:1px solid var(--border);background:rgba(10,14,26,0.8);color:var(--text);font-size:12px;width:150px">
    <button class="btn btn-sm" onclick="doFilter()">筛选</button>
    <button class="btn btn-sm" onclick="resetFilter()">重置</button>
  </div>

  <div class="table-wrapper">
    <table class="data-table" id="dataTable">
      <thead><tr id="tableHeader"></tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
  <div id="emptyState" style="text-align:center;padding:60px 20px;color:var(--text2);display:none">
    <div style="font-size:48px;opacity:0.5;margin-bottom:16px">📋</div>
    <p>暂无数据，点击「＋ 新增故障」或「导入Excel」开始</p>
  </div>
</div>

<!-- 新增/编辑弹窗 -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h2 id="editModalTitle">新增故障记录</h2>
    <div style="max-height:55vh;overflow-y:auto;padding-right:8px">
      <div class="form-row">
        <div class="form-group"><label>日期</label><input type="date" id="f_date"></div>
        <div class="form-group"><label>线路</label><input type="text" id="f_line" placeholder="如：1号线"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>故障点/车站</label><input type="text" id="f_fault_point" placeholder="如：天安门东站"></div>
        <div class="form-group"><label>设备名称</label><input type="text" id="f_device_name" placeholder="如：断路器"></div>
      </div>
      <div class="form-group"><label>故障描述</label><textarea id="f_fault_desc" placeholder="故障现象描述"></textarea></div>
      <div class="form-row">
        <div class="form-group"><label>故障类型</label><input type="text" id="f_fault_type" placeholder="如：电气故障"></div>
        <div class="form-group"><label>部门</label><input type="text" id="f_dept" placeholder="如：工电中心"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>责任班组</label><input type="text" id="f_duty_team" placeholder="如：检修一班"></div>
        <div class="form-group"><label>维修单位</label><input type="text" id="f_repair_unit" placeholder="如：自检班组"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>维修状态</label>
          <select id="f_repair_status">
            <option value="">-- 请选择 --</option>
            <option value="未处理">未处理</option>
            <option value="处理中">处理中</option>
            <option value="已修复">已修复</option>
            <option value="无法修复">无法修复</option>
          </select>
        </div>
        <div class="form-group"><label>故障等级</label>
          <select id="f_fault_level">
            <option value="">-- 请选择 --</option>
            <option value="一级">一级（重大）</option>
            <option value="二级">二级（较大）</option>
            <option value="三级">三级（一般）</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>自检/非自检</label>
          <select id="f_self_check">
            <option value="">-- 请选择 --</option>
            <option value="自检">自检</option>
            <option value="非自检">非自检</option>
          </select>
        </div>
        <div class="form-group"><label>填报人</label><input type="text" id="f_reporter" placeholder="填报人姓名"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>报修时间</label><input type="datetime-local" id="f_report_time"></div>
        <div class="form-group"><label>到达时间</label><input type="datetime-local" id="f_arrive_time"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>修复时间</label><input type="datetime-local" id="f_fix_time"></div>
        <div class="form-group"><label>响应分钟数</label><input type="number" id="f_response_min" placeholder="如：15"></div>
      </div>
      <div class="form-group"><label>维修措施</label><textarea id="f_repair_measure" placeholder="采取的维修措施"></textarea></div>
      <div class="form-group"><label>故障经过</label><textarea id="f_fault_process" placeholder="故障处理经过"></textarea></div>
      <div class="form-row">
        <div class="form-group"><label>报修单位</label><input type="text" id="f_report_unit"></div>
        <div class="form-group"><label>应急状态</label><input type="text" id="f_emergency_status"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>工单号</label><input type="text" id="f_order_no"></div>
        <div class="form-group"><label>登记地点</label><input type="text" id="f_register_loc"></div>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn" onclick="closeEditModal()">取消</button>
      <button class="btn btn-primary" onclick="saveRecord()">保存</button>
    </div>
  </div>
</div>

<script>
const API = '';
let TOKEN = localStorage.getItem('gd_token') || '';
let allData = [];
let filteredData = [];
let selectedIds = new Set();
let editingId = null;

const COLUMNS = [
  {label:'日期',       key:'date',             width:'100px'},
  {label:'线路',       key:'line',             width:'80px'},
  {label:'故障点',     key:'fault_point',       width:'120px'},
  {label:'设备名称',   key:'device_name',       width:'120px'},
  {label:'故障描述',   key:'fault_desc',        width:'200px'},
  {label:'故障类型',   key:'fault_type',        width:'100px'},
  {label:'部门',       key:'dept',             width:'100px'},
  {label:'责任班组',   key:'duty_team',         width:'100px'},
  {label:'维修单位',   key:'repair_unit',       width:'100px'},
  {label:'维修状态',   key:'repair_status',     width:'90px'},
  {label:'故障等级',   key:'fault_level',       width:'90px'},
  {label:'自检',       key:'self_check',        width:'80px'},
  {label:'填报人',     key:'reporter',          width:'80px'},
  {label:'报修时间',   key:'report_time',       width:'140px'},
  {label:'到达时间',   key:'arrive_time',       width:'140px'},
  {label:'修复时间',   key:'fix_time',          width:'140px'},
  {label:'响应(分钟)', key:'response_min',      width:'90px'},
];

function authHeaders(){
  return {'Authorization':'Bearer '+TOKEN, 'Content-Type':'application/json'};
}

// 初始化
loadData();

async function loadData(){
  try {
    const resp = await fetch('/api/faults', {headers:authHeaders()});
    if(!resp.ok) { console.error('加载失败', resp.status); return; }
    allData = await resp.json();
    filteredData = [...allData];
    renderTable();
    renderStats();
  } catch(e) { console.error('加载数据出错', e); }
}

function renderTable(){
  const thead = document.getElementById('tableHeader');
  const tbody = document.getElementById('tableBody');
  const empty = document.getElementById('emptyState');

  thead.innerHTML =
    '<th style="width:40px"><input type="checkbox" class="cell-checkbox" onclick="toggleSelectAll(this)"></th>' +
    COLUMNS.map(c => '<th style="min-width:'+c.width+'" title="'+c.label+'">'+c.label+'</th>').join('') +
    '<th style="width:80px">操作</th>';

  if(filteredData.length===0){
    tbody.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  tbody.innerHTML = filteredData.map(row => {
    const isSelected = selectedIds.has(row.id);
    return '<tr class="'+(isSelected?'selected':'')+'">' +
      '<td><input type="checkbox" class="cell-checkbox" '+(isSelected?'checked':'')+' onchange="toggleSelect('+row.id+',this.checked)"></td>' +
      COLUMNS.map(c => {
        const val = row[c.key] || '';
        return '<td title="'+escH(val)+'" onclick="makeEditable(this,'+row.id+',''+c.key+'')">'+escH(val)+'</td>';
      }).join('') +
      '<td><button class="btn btn-sm" onclick="editRecord('+row.id+')">✏️</button> <button class="btn btn-sm btn-danger" onclick="deleteOne('+row.id+')">🗑</button></td>' +
    '</tr>';
  }).join('');
}

function renderStats(){
  const total = allData.length;
  const now = new Date();
  const thisMonth = allData.filter(d => d.date && d.date.startsWith(now.toISOString().slice(0,7))).length;
  const selfCheck = allData.filter(d => d.self_check==='自检').length;
  const notSelfCheck = allData.filter(d => d.self_check==='非自检').length;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statMonth').textContent = thisMonth;
  document.getElementById('statSelfCheck').textContent = selfCheck;
  document.getElementById('statNotSelfCheck').textContent = notSelfCheck;
}

/* 单元格编辑 */
let editingCell = null;
function makeEditable(td, id, field){
  if(editingCell === td) return;
  if(editingCell) cancelEdit();
  editingCell = td;
  const original = td.textContent;
  td.setAttribute('contenteditable','true');
  td.focus();
  const range = document.createRange();
  range.selectNodeContents(td);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  td.onblur = async ()=>{
    const newVal = td.textContent.trim();
    if(newVal !== original){ await updateField(id, field, newVal); }
    cancelEdit();
  };
  td.onkeydown = (e)=>{
    if(e.key==='Enter'){ e.preventDefault(); td.blur(); }
    if(e.key==='Escape'){ td.textContent = original; td.blur(); }
  };
}
function cancelEdit(){
  if(editingCell){
    editingCell.removeAttribute('contenteditable');
    editingCell.onblur = null;
    editingCell.onkeydown = null;
    editingCell = null;
  }
}
async function updateField(id, field, value){
  const resp = await fetch('/api/faults/'+id, {
    method:'PUT', headers:authHeaders(),
    body: JSON.stringify({[field]: value})
  });
  if(resp.ok) loadData();
}

/* 选择 */
function toggleSelect(id, checked){
  if(checked) selectedIds.add(id); else selectedIds.delete(id);
  updateSelection();
}
function toggleSelectAll(el){
  const checked = el.checked;
  filteredData.forEach(r => {
    if(checked) selectedIds.add(r.id); else selectedIds.delete(r.id);
  });
  renderTable();
  updateSelection();
}
function updateSelection(){
  const n = selectedIds.size;
  document.getElementById('btnDelete').style.display = n>0?'inline-flex':'none';
  document.getElementById('selectedCount').textContent = n>0?'已选 '+n+' 条':'';
}

/* 新增/编辑弹窗 */
function showAddModal(){
  editingId = null;
  document.getElementById('editModalTitle').textContent = '新增故障记录';
  clearForm();
  document.getElementById('editModal').classList.add('active');
}
function editRecord(id){
  const row = allData.find(d=>d.id===id);
  if(!row) return;
  editingId = id;
  document.getElementById('editModalTitle').textContent = '编辑故障记录';
  fillForm(row);
  document.getElementById('editModal').classList.add('active');
}
function closeEditModal(){
  document.getElementById('editModal').classList.remove('active');
  editingId = null;
}
function clearForm(){
  const ids = ['f_date','f_line','f_fault_point','f_device_name','f_fault_desc',
    'f_fault_type','f_dept','f_duty_team','f_repair_unit','f_repair_status',
    'f_fault_level','f_self_check','f_reporter','f_report_time',
    'f_arrive_time','f_fix_time','f_response_min','f_repair_measure',
    'f_fault_process','f_report_unit','f_emergency_status','f_order_no','f_register_loc'];
  ids.forEach(id => {
    const el = document.getElementById(id);
    if(el) el.tagName==='SELECT' ? el.selectedIndex=0 : el.value='';
  });
}
function fillForm(row){
  setVal('f_date',             row.date||'');
  setVal('f_line',            row.line||'');
  setVal('f_fault_point',     row.fault_point||'');
  setVal('f_device_name',     row.device_name||'');
  setVal('f_fault_desc',      row.fault_desc||'');
  setVal('f_fault_type',      row.fault_type||'');
  setVal('f_dept',            row.dept||'');
  setVal('f_duty_team',       row.duty_team||'');
  setVal('f_repair_unit',     row.repair_unit||'');
  setVal('f_repair_status',   row.repair_status||'');
  setVal('f_fault_level',     row.fault_level||'');
  setVal('f_self_check',       row.self_check||'');
  setVal('f_reporter',        row.reporter||'');
  setVal('f_report_time',      row.report_time||'');
  setVal('f_arrive_time',     row.arrive_time||'');
  setVal('f_fix_time',        row.fix_time||'');
  setVal('f_response_min',     row.response_min||'');
  setVal('f_repair_measure',  row.repair_measure||'');
  setVal('f_fault_process',   row.fault_process||'');
  setVal('f_report_unit',     row.report_unit||'');
  setVal('f_emergency_status',row.emergency_status||'');
  setVal('f_order_no',        row.order_no||'');
  setVal('f_register_loc',    row.register_loc||'');
}
function setVal(id, val){
  const el = document.getElementById(id);
  if(!el) return;
  if(el.tagName==='SELECT'){
    for(let i=0;i<el.options.length;i++){
      if(el.options[i].value===val){el.selectedIndex=i;return;}
    }
  } else {
    el.value = val;
  }
}

async function saveRecord(){
  const data = {
    date:             document.getElementById('f_date').value,
    line:            document.getElementById('f_line').value,
    fault_point:     document.getElementById('f_fault_point').value,
    device_name:     document.getElementById('f_device_name').value,
    fault_desc:      document.getElementById('f_fault_desc').value,
    fault_type:      document.getElementById('f_fault_type').value,
    dept:            document.getElementById('f_dept').value,
    duty_team:       document.getElementById('f_duty_team').value,
    repair_unit:     document.getElementById('f_repair_unit').value,
    repair_status:   document.getElementById('f_repair_status').value,
    fault_level:     document.getElementById('f_fault_level').value,
    self_check:       document.getElementById('f_self_check').value,
    reporter:        document.getElementById('f_reporter').value,
    report_time:      document.getElementById('f_report_time').value,
    arrive_time:     document.getElementById('f_arrive_time').value,
    fix_time:        document.getElementById('f_fix_time').value,
    response_min:    document.getElementById('f_response_min').value,
    repair_measure:  document.getElementById('f_repair_measure').value,
    fault_process:   document.getElementById('f_fault_process').value,
    report_unit:     document.getElementById('f_report_unit').value,
    emergency_status:document.getElementById('f_emergency_status').value,
    order_no:        document.getElementById('f_order_no').value,
    register_loc:    document.getElementById('f_register_loc').value,
  };
  Object.keys(data).forEach(k=>{if(data[k]==='') delete data[k];});

  let resp;
  if(editingId){
    resp = await fetch('/api/faults/'+editingId, {
      method:'PUT', headers:authHeaders(),
      body: JSON.stringify(data)
    });
  } else {
    resp = await fetch('/api/faults', {
      method:'POST', headers:authHeaders(),
      body: JSON.stringify(data)
    });
  }
  if(resp.ok){
    closeEditModal();
    loadData();
  } else {
    alert('保存失败：'+(await resp.json()).detail||'未知错误');
  }
}

/* 删除 */
async function deleteOne(id){
  if(!confirm('确认删除该条记录？')) return;
  const resp = await fetch('/api/faults/'+id, {method:'DELETE',headers:authHeaders()});
  if(resp.ok) loadData();
}
async function deleteSelected(){
  if(selectedIds.size===0) return;
  if(!confirm('确认删除选中的 '+selectedIds.size+' 条记录？')) return;
  for(const id of selectedIds){
    await fetch('/api/faults/'+id, {method:'DELETE',headers:authHeaders()});
  }
  selectedIds.clear();
  loadData();
}

/* 筛选 */
function doFilter(){
  const lineVal = document.getElementById('filterLine').value.trim().toLowerCase();
  const deptVal = document.getElementById('filterDept').value.trim().toLowerCase();
  const scVal   = document.getElementById('filterSelfCheck').value;
  const kw      = document.getElementById('filterKeyword').value.trim().toLowerCase();

  filteredData = allData.filter(row => {
    if(lineVal && !(row.line||'').toLowerCase().includes(lineVal)) return false;
    if(deptVal && !(row.dept||'').toLowerCase().includes(deptVal)) return false;
    if(scVal   && row.self_check!==scVal) return false;
    if(kw) {
      const allText = COLUMNS.map(c=>row[c.key]||'').join(' ').toLowerCase();
      if(!allText.includes(kw)) return false;
    }
    return true;
  });
  selectedIds.clear();
  renderTable();
  updateSelection();
}
function resetFilter(){
  document.getElementById('filterLine').value = '';
  document.getElementById('filterDept').value = '';
  document.getElementById('filterSelfCheck').value = '';
  document.getElementById('filterKeyword').value = '';
  filteredData = [...allData];
  selectedIds.clear();
  renderTable();
  updateSelection();
}

/* 导出 */
function exportExcel(){
  window.open('/api/faults/export?token='+TOKEN, '_blank');
}

/* 导入 */
async function importExcel(input){
  const file = input.files[0];
  if(!file){ alert('请选择 Excel 文件'); return; }
  const fd = new FormData();
  fd.append('file', file);
  const resp = await fetch('/api/faults/import', {
    method:'POST', headers:{'Authorization':'Bearer '+TOKEN}, body:fd
  });
  if(resp.ok){
    const result = await resp.json();
    alert('导入成功！新增 '+result.created+' 条，更新 '+result.updated+' 条');
    loadData();
  } else {
    alert('导入失败：'+(await resp.json()).detail||'未知错误');
  }
  input.value = '';
}

function escH(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
